[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x5"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118.0",
    "ipykernel>=6.30.1",
    "joblib>=1.5.2",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pip>=25.2",
    "scikit-learn>=1.7.2",
    "transformers>=4.56.2",
    "uvicorn>=0.37.0",
    "xgboost>=3.0.5",
    "torch>=2.8.0",
    "sentence-transformers>=5.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
